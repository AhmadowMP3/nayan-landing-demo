server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # behind Coolify's proxy: keep redirects relative so they never expose :3000
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;
    # text/html is always compressed once gzip is on
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # NB: add_header in a location replaces the server-level ones, so every location repeats the
    # security headers.

    # index.html — always revalidate, so a new deploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # hashed Vite bundles (e.g. /assets/index-Bkja6B-L.js) — content-addressed, cache forever
    # (quoted: nginx needs quotes around a regex that contains {})
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # images, film frames, fonts, video — 30 days, NOT immutable (files may be replaced in place)
    location ~* \.(?:webp|avif|jpe?g|png|gif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # everything else — SPA fallback: unknown routes get index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
